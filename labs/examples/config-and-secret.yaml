# Day 42: ConfigMap and Secret consumed as env vars and as files.
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
data:
  LOG_LEVEL: info
  settings.yaml: |
    feature_flags:
      new_ui: true
---
apiVersion: v1
kind: Secret
metadata:
  name: app-secret
type: Opaque
stringData:          # stringData is encoded for you. NOTE: base64 is not encryption.
  DB_PASSWORD: change-me
---
apiVersion: v1
kind: Pod
metadata:
  name: config-demo
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "env | grep -E 'LOG_LEVEL|DB_PASSWORD'; cat /config/settings.yaml; sleep 3600"]
      envFrom:
        - configMapRef:
            name: app-config
        - secretRef:
            name: app-secret
      volumeMounts:
        - name: config
          mountPath: /config
  volumes:
    - name: config
      configMap:
        name: app-config
        items:
          - key: settings.yaml
            path: settings.yaml
